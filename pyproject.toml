[project]
name = "youtube-transcripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "youtube-transcript-api",
    "yt-dlp",
    "pytube",
    "openai",
    "python-dotenv",
    "rapidocr-onnxruntime>=1.4,<2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "imagehash>=4.3",
    "rapidfuzz>=3.5",
    "requests>=2.31",
    "html2text>=2024.2",
]

[project.scripts]
yt-distill = "yt_distill.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: end-to-end tests that may hit external resources",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_distill", "vendor"]
