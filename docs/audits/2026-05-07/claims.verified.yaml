- id: c-0158
  source_file: README.md
  source_line: 78
  owner: owned
  claim_type: behavioral
  subtype: flag_behavior
  claim_text: --no-frames makes extract.py run transcript-only.
  expected_value: transcript-only run
  verifiable_by:
  - doc
  - code
  - vps
  status: UNVERIFIABLE
  doc_says: '| `--max-frames N` | `extract.py`, `run.py` | Cap frames extracted from
    the video |

    | `--start`, `--end` | `extract.py`, `run.py` | Clip a sub-range; timestamps stay
