- id: c-0010
  source_file: docs/superpowers/specs/2026-05-07-youtube-transcripts-claude-video-merge-design.md
  source_line: 28
  owner: owned
  claim_type: concrete
  subtype: source_support
  claim_text: The pipeline is intended to support YouTube, yt-dlp-supported platforms,
    and local files.
  expected_value:
  - YouTube
  - yt-dlp sources
  - local video files
  verifiable_by:
  - doc
  - code
  status: UNVERIFIABLE
  doc_says: "- **Every claim in the output is traceable** to a transcript segment\
    \ ID, frame ID, or `t=MM:SS` timestamp. Auditability is a hard requirement, not\
    \ a nice-to-have.\n- **Idempotent and resumable.** Re-running on the same source\
    \ must skip completed work unless `--force`. Re-distilling with a different style\
    \ or model must not re-download or re-OCR.\n- Support YouTube + anything `yt-dlp`\
    \ handles (TikTok, Vimeo, X, Loom, \u2026) + local video files.\n- Preserve full\
    \ intermediate artifacts in `Generated_Data/<title>/` so re-distilling with a\
    \ different style is a free, offline operation.\n- Keep the LLM/model layer easy\
    \ to reconfigure \u2014 vision-capable models change frequently \u2014 and *validate*\
    \ configured models, not just trust profile flags."
  suggested_fix: ''
