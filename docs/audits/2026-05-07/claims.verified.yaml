  subtype: repository_url
  claim_text: claude-video repository URL is https://github.com/bradautomates/claude-video.
  expected_value: https://github.com/bradautomates/claude-video
  verifiable_by:
  - doc
  status: MATCH
  doc_says: "\n- **`youtube-transcripts`** (this repo): YouTube transcript downloader\
    \ with a 3-method fallback chain (`youtube-transcript-api` \u2192 `pytube` \u2192\
    \ `yt-dlp` captions), title-aware output paths, paragraph cleanup, and a *style\
    \ transformation* layer that runs transcripts through markdown style guides via\
    \ OpenRouter (`google/gemini-3-flash-preview`) into `Generated_Data/<title>/`.\n\
    - **`claude-video`** (https://github.com/bradautomates/claude-video): a Claude\
    \ Code skill (`/watch`) that downloads any yt-dlp source, extracts auto-budgeted\
    \ frames with `ffmpeg` (\u2264100 frames, \u22642 fps, duration-aware), pulls\
    \ captions with Whisper (Groq/OpenAI) fallback, then has Claude `Read` each frame\
    \ as an image.\n\nThe shared piece is transcript fetching. The new capability\
    \ `claude-video` brings is **frames as multimodal evidence**. The goal of this\
    \ merge is not transcript redundancy but to **enrich the existing distillation**\
