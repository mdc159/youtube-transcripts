  source_line: 11
  owner: owned
  claim_type: concrete
  subtype: fallback_chain
  claim_text: 'youtube-transcripts uses a 3-method transcript fallback chain: youtube-transcript-api,
    pytube, then yt-dlp captions.'
  expected_value:
  - youtube-transcript-api
  - pytube
  - yt-dlp captions
  verifiable_by:
  - code
  - doc
  status: UNVERIFIABLE
  doc_says: "Two repositories with overlapping concerns:\n\n- **`youtube-transcripts`**\
    \ (this repo): YouTube transcript downloader with a 3-method fallback chain (`youtube-transcript-api`\
    \ \u2192 `pytube` \u2192 `yt-dlp` captions), title-aware output paths, paragraph\
    \ cleanup, and a *style transformation* layer that runs transcripts through markdown\
    \ style guides via OpenRouter (`google/gemini-3-flash-preview`) into `Generated_Data/<title>/`.\n\
    - **`claude-video`** (https://github.com/bradautomates/claude-video): a Claude\
    \ Code skill (`/watch`) that downloads any yt-dlp source, extracts auto-budgeted\
    \ frames with `ffmpeg` (\u2264100 frames, \u22642 fps, duration-aware), pulls\
    \ captions with Whisper (Groq/OpenAI) fallback, then has Claude `Read` each frame\
    \ as an image.\n"
  suggested_fix: ''
