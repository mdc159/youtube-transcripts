  owner: owned
  claim_type: concrete
  subtype: similarity_threshold
  claim_text: OCR dedup clusters use fingerprint similarity threshold >= 0.85 via
    rapidfuzz token-set ratio.
  expected_value: 0.85
  verifiable_by:
  - code
  - doc
  status: MATCH
  doc_says: "\n1. For all frames classified `code`, compute a normalized fingerprint\
    \ of OCR text (whitespace collapsed, case preserved, comments and trailing punctuation\
    \ stripped).\n2. Cluster frames with fingerprint similarity \u2265 0.85 (rapidfuzz\
    \ token-set ratio).\n3. Within a cluster, keep only frames where the OCR text\
    \ *changes* \u2014 i.e. the first frame of the cluster, plus any frame whose fingerprint\
    \ diverges enough to break the cluster.\n4. Each cluster gets a `cluster_id`;\
    \ `ocr.json` records both the per-frame text and `cluster_id` so distill can reason\
    \ at cluster level."
  suggested_fix: ''
